{% extends "base.html" %}
{% block content %}

<h2>Gestion de Grupos</h2>

<form action="{{ '/grupos?edit_id=' + grupo_edit._id|string if grupo_edit else '/grupos' }}" method="POST">
    <input type="text" name="grado" placeholder="Grado" value="{{ grupo_edit.grado if grupo_edit else '' }}" required>
    <input type="text" name="grupo" placeholder="Grupo" value="{{ grupo_edit.grupo if grupo_edit else '' }}" required>
    <input type="text" name="especialidad" placeholder="Especialidad" value="{{ grupo_edit.especialidad if grupo_edit else '' }}" required>
    
    <select name="maestro_id" required>
        <option value="">Seleccione un maestro</option>
        {% for m in maestros %}
        <option value="{{ m.nombre }}" {% if grupo_edit and grupo_edit.maestro_id == m.nombre %}selected{% endif %}>{{ m.nombre }}</option>
        {% endfor %}
    </select>

    <button type="submit">{{ 'Modificar Grupo' if grupo_edit else 'Guardar Grupo' }}</button>
    {% if grupo_edit %}<a href="/grupos">Cancelar</a>{% endif %}
    
</form>

<table>
    
    <tr>
        
        <th>Grado/Grupo</th>
        <th>Especialidad</th>
        <th>Maestro</th>
        <th>Acción</th>
        
    </tr>
    
    {% for g in lista %}
    
    <tr>
        
        <td>{{ g.grado }} - {{ g.grupo }}</td>
        <td>{{ g.especialidad }}</td>
        <td>{{ g.maestro_id }}</td>
        <td>
            
            <a href="/grupos?edit_id={{ g._id }}">Editar</a> | 
            <a href="/eliminar_grupo/{{ g._id }}" onclick="return confirm('¿Seguro?');">Eliminar</a>
            
        </td>
        
    </tr>
    
    {% endfor %}
    
</table>

{% endblock %}
